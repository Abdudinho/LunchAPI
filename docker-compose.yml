
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: lunch
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "0208"
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d lunch"]
      interval: 3s
      timeout: 3s
      retries: 10

  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      DB_HOST: db
    depends_on:
      db:
        condition: service_healthy
    restart: on-failure

volumes:
  postgres_data:
